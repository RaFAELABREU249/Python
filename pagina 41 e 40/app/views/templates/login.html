{% extends 'base.html' %}
{% block title %}Login - Controle de Tarefas{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title mb-4"><i class="bi bi-box-arrow-in-right"></i> Entrar</h4>
                <form method="post" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Senha</label>
                        <input type="password" name="senha" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-door-open"></i> Entrar</button>
                </form>
                <div class="mt-3 text-center">
                    <a href="{{ url_for('auth.registro') }}">Não tem conta? Cadastre-se</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
