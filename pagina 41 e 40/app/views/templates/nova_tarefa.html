{% extends 'base.html' %}
{% block title %}Nova Tarefa - Controle de Tarefas{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4 class="card-title mb-4"><i class="bi bi-plus-circle"></i> Criar nova tarefa</h4>
                <form method="post" novalidate>
                    <div class="mb-3">
                        <label class="form-label">Título</label>
                        <input type="text" name="titulo" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descrição</label>
                        <textarea name="descricao" rows="4" class="form-control" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            {% for option in status_options %}
                            <option value="{{ option }}">{{ option.title() }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success"><i class="bi bi-save"></i> Salvar</button>
                    <a href="{{ url_for('tasks.dashboard') }}" class="btn btn-secondary ms-2"><i class="bi bi-arrow-left"></i> Voltar</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
